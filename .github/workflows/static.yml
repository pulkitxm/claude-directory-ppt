name: Review and publish notice
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed notice after owner approval
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/check-site.py
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/check-site.py
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: claude-directory-ppt
          permission-actions: read
          permission-pages: write
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          token: ${{ steps.app-token.outputs.token }}
